<!DOCTYPE html>
<html>
<head>
    <title>Aman's Website</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            color: blue;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Welcome to Aman's Website</h1>

        <p>Hello! My name is Aman.</p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Website is working! 😊";
        }
    </script>

</body>
</html>
